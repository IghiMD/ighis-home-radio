<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Debug - Ighi's Home Radio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        .ok { color: #00ff88; font-weight: bold; }
        .error { color: #ff2d55; font-weight: bold; }
        .warning { color: #ff8c00; font-weight: bold; }
        .info { color: #60a5fa; }
        pre {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            overflow: auto;
            border-left: 4px solid #60a5fa;
            max-height: 300px;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 8px;
        }
        .button {
            background: #60a5fa;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
            display: inline-block;
            margin: 5px;
            cursor: pointer;
            border: none;
        }
        .button:hover {
            background: #3b82f6;
        }
        #results {
            margin-top: 20px;
        }
        .test-item {
            margin: 10px 0;
            padding: 10px;
            background: #262626;
            border-radius: 6px;
            border-left: 4px solid #666;
        }
        .test-item.success {
            border-left-color: #00ff88;
        }
        .test-item.error {
            border-left-color: #ff2d55;
        }
        .test-item.warning {
            border-left-color: #ff8c00;
        }
    </style>
</head>
<body>
    <h1>🔍 Frontend Debug Tool</h1>
    <p>Tento nástroj skontroluje prečo sa frontend neprepája na backend.</p>

    <div class="section">
        <h2>🧪 Testy API pripojenia</h2>
        <button class="button" onclick="testAllAPIs()">🚀 Spustiť všetky testy</button>
        <button class="button" onclick="clearResults()">🗑️ Vyčistiť výsledky</button>
        <button class="button" onclick="testCrispChat()">💬 Test Crisp Chat</button>
        <button class="button" onclick="simulateRadioLoad()">🎵 Simuluj načítanie rádia</button>
    </div>

    <div id="results"></div>

    <script>
        const results = document.getElementById('results');
        
        function addResult(title, status, message, data = null) {
            const div = document.createElement('div');
            div.className = `test-item ${status}`;
            
            let content = `<h4>${title}</h4><p>${message}</p>`;
            if (data) {
                content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            div.innerHTML = content;
            
            results.appendChild(div);
            console.log(`[${status.toUpperCase()}] ${title}: ${message}`, data || '');
        }
        
        function clearResults() {
            results.innerHTML = '';
            console.clear();
        }
        
        async function testAPI(endpoint, description) {
            try {
                addResult(`🔗 ${description}`, 'info', `Testujem: ${endpoint}`);
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch(endpoint, {
                    signal: controller.signal,
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`Invalid content type: ${contentType}`);
                }
                
                const data = await response.json();
                
                addResult(`✅ ${description}`, 'success', `Úspešne načítané (${response.status})`, data);
                return data;
                
            } catch (error) {
                addResult(`❌ ${description}`, 'error', `Chyba: ${error.message}`);
                return null;
            }
        }
        
        async function testAllAPIs() {
            clearResults();
            addResult('🚀 Frontend Debug', 'info', 'Spúšťam diagnostiku...');
            
            // Test 1: Basic fetch support
            if (typeof fetch === 'undefined') {
                addResult('❌ Fetch API', 'error', 'Fetch API nie je podporované v tomto prehliadači');
                return;
            } else {
                addResult('✅ Fetch API', 'success', 'Fetch API je podporované');
            }
            
            // Test 2: Current song API
            const currentSong = await testAPI('webhook.php?action=current', 'Current Song API');
            
            // Test 3: Config API  
            const config = await testAPI('get_config.php', 'Configuration API');
            
            // Test 4: Health check
            const health = await testAPI('webhook.php?action=health', 'Health Check API');
            
            // Test 5: Stream metadata
            if (config && config.ICY_SERVER) {
                await testAPI(config.ICY_SERVER, 'Stream Metadata');
            }
            
            // Test 6: CORS check
            try {
                const corsTest = await fetch('webhook.php?action=health', {
                    method: 'OPTIONS'
                });
                addResult('✅ CORS', 'success', `CORS je správne nastavený (${corsTest.status})`);
            } catch (error) {
                addResult('❌ CORS', 'error', `CORS problém: ${error.message}`);
            }
            
            // Test 7: JavaScript errors
            const errorCount = getJSErrorCount();
            if (errorCount > 0) {
                addResult('⚠️ JavaScript Errors', 'warning', `Nájdených ${errorCount} JavaScript chýb - skontroluj konzolu`);
            } else {
                addResult('✅ JavaScript', 'success', 'Žiadne JavaScript chyby');
            }
            
            // Test 8: Local storage
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                addResult('✅ Local Storage', 'success', 'Local Storage funguje');
            } catch (error) {
                addResult('❌ Local Storage', 'error', `Local Storage problém: ${error.message}`);
            }
            
            // Summary
            addResult('📊 Diagnostika dokončená', 'info', 'Skontroluj výsledky vyššie. Zelené = OK, Červené = Opraviť');
        }
        
        function testCrispChat() {
            addResult('💬 Crisp Chat Test', 'info', 'Testujem Crisp Chat...');
            
            // Check if Crisp is loaded
            if (typeof window.$crisp !== 'undefined') {
                addResult('✅ Crisp Variable', 'success', 'Crisp premenná existuje');
                
                // Check if Crisp is fully loaded
                if (window.$crisp && window.$crisp.length >= 0) {
                    addResult('✅ Crisp Loaded', 'success', 'Crisp Chat je načítaný');
                    
                    // Try to trigger Crisp
                    try {
                        window.$crisp.push(["do", "chat:show"]);
                        addResult('✅ Crisp Function', 'success', 'Crisp funkcie fungujú - chat by sa mal zobraziť');
                    } catch (error) {
                        addResult('❌ Crisp Function', 'error', `Crisp funkcie nefungujú: ${error.message}`);
                    }
                } else {
                    addResult('⚠️ Crisp Loading', 'warning', 'Crisp sa ešte načítava...');
                }
            } else {
                addResult('❌ Crisp Missing', 'error', 'Crisp Chat nie je načítaný - skontroluj script tag');
                
                // Try to load Crisp manually
                addResult('🔧 Manual Crisp Load', 'info', 'Pokúšam sa načítať Crisp manuálne...');
                loadCrispManually();
            }
        }
        
        function loadCrispManually() {
            try {
                window.$crisp = [];
                window.CRISP_WEBSITE_ID = "64a5256d-4d7d-4f39-bc0d-21bf8057079d";
                
                const script = document.createElement("script");
                script.src = "https://client.crisp.chat/l.js";
                script.async = true;
                
                script.onload = function() {
                    addResult('✅ Manual Crisp', 'success', 'Crisp Chat načítaný manuálne!');
                };
                
                script.onerror = function() {
                    addResult('❌ Manual Crisp', 'error', 'Crisp Chat sa nepodarilo načítať ani manuálne');
                };
                
                document.head.appendChild(script);
                
            } catch (error) {
                addResult('❌ Manual Crisp Error', 'error', `Chyba pri manuálnom načítaní: ${error.message}`);
            }
        }
        
        async function simulateRadioLoad() {
            addResult('🎵 Radio Simulation', 'info', 'Simulujem načítanie rádia...');
            
            try {
                // Simulate API config loading
                const config = await testAPI('get_config.php', 'API Config for Radio');
                
                if (config) {
                    addResult('✅ Radio Config', 'success', 'Konfigurácia pre rádio načítaná');
                    
                    // Simulate current track loading
                    const track = await testAPI('webhook.php?action=current', 'Current Track for Radio');
                    
                    if (track && track.data) {
                        addResult('✅ Radio Track', 'success', `Skladba načítaná: ${track.data.artist} - ${track.data.title}`);
                        
                        // Simulate frontend display
                        displayTrackSimulation(track.data);
                        
                    } else {
                        addResult('❌ Radio Track', 'error', 'Nepodarilo sa načítať skladbu');
                    }
                } else {
                    addResult('❌ Radio Config', 'error', 'Nepodarilo sa načítať konfiguráciu pre rádio');
                }
                
            } catch (error) {
                addResult('❌ Radio Simulation', 'error', `Chyba pri simulácii: ${error.message}`);
            }
        }
        
        function displayTrackSimulation(trackData) {
            const simulation = document.createElement('div');
            simulation.className = 'test-item success';
            simulation.innerHTML = `
                <h4>🎵 Simulácia zobrazenia skladby</h4>
                <div style="background: #1a1a1a; padding: 15px; border-radius: 8px; margin: 10px 0;">
                    <h3 style="color: #60a5fa; margin: 0 0 10px 0;">${trackData.title}</h3>
                    <p style="color: #cbd5e1; margin: 0 0 5px 0;">by ${trackData.artist}</p>
                    <p style="color: #9ca3af; margin: 0; font-size: 14px;">
                        Album: ${trackData.album || '-'} | 
                        Year: ${trackData.year || '-'} | 
                        Genre: ${trackData.genre || '-'}
                    </p>
                    ${trackData.artwork ? `<img src="${trackData.artwork}" style="width: 100px; height: 100px; margin-top: 10px; border-radius: 8px;">` : ''}
                </div>
                <p><strong>Ak index.html stále zobrazuje "Test Song", problém je v JavaScript kóde!</strong></p>
            `;
            results.appendChild(simulation);
        }
        
        function getJSErrorCount() {
            // This is a simple check - in real scenario we'd need error tracking
            return 0;
        }
        
        // Error tracking
        let jsErrors = [];
        window.addEventListener('error', function(e) {
            jsErrors.push({
                message: e.message,
                filename: e.filename,
                lineno: e.lineno,
                colno: e.colno,
                stack: e.error ? e.error.stack : null
            });
        });
        
        // Auto-run basic test on load
        setTimeout(() => {
            addResult('🔧 Frontend Debug Tool', 'info', 'Nástroj načítaný. Klikni "Spustiť všetky testy" pre diagnózu.');
        }, 500);
    </script>
</body>
</html>
